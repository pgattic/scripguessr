[package]
name = "scripguessr"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["router", "web"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
rand = { version = "0.9", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "=0.3.104"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
web-sys = { version = "=0.3.104", features = ["Document", "Element", "Headers", "RequestCredentials", "RequestInit", "Response", "ScrollBehavior", "ScrollIntoViewOptions", "ScrollLogicalPosition", "Storage", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
argon2 = "0.5"
axum = "0.8"
sqlx = { version = "0.8", features = ["json", "migrate", "postgres", "runtime-tokio-rustls", "time", "uuid"] }
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower-sessions = "0.14"
tracing = "0.1"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[features]
default = ["web"]
web = ["dioxus/web"]
